services:
  # ─────────────────────────── Инфраструктура обмена сообщениями ───────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # Внешний listener для подключения с хоста (например, из dotnet run локально).
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Два listener'а: INTERNAL — для сервисов внутри сети Docker, EXTERNAL — для хоста.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  redis:
    image: redis:7.2-alpine
    container_name: eventapi-redis
    ports: 
     - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  # ─────────────────────────── Мониторинг ───────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: eventapi-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: eventapi-jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  grafana:
    image: grafana/grafana:10.4.2
    container_name: eventapi-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana

  # ─────────────────────────── Базы данных (по одной на сервис) ───────────────────────────
  users-db:
    image: postgres:16
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  events-db:
    image: postgres:16
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookings-db:
    image: postgres:16
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - bookings-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

# ─────────────────────────── Сервисы ───────────────────────────
  user-service:
    build:
      context: .
      args:
        PROJECT: src/EventManager.UserService/EventManager.UserService.Presentation/EventManager.UserService.Presentation.csproj
    command: ["EventManager.UserService.Presentation.dll"]
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      OTEL_SERVICE_NAME: user-service
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0
      ConnectionStrings__UsersDb: Host=users-db;Port=5432;Database=users;Username=postgres;Password=postgres
      UserJwtToken__Secret: lemon-dipper-kiwi-wish-whisking-squander
      Otlp__Endpoint: http://jaeger:4317
    depends_on:
      users-db:
        condition: service_healthy

  event-service:
    build:
      context: .
      args:
        PROJECT: src/EventManager.EventService/EventManager.EventService.Presentation/EventManager.EventService.Presentation.csproj
    command: ["EventManager.EventService.Presentation.dll"]
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      OTEL_SERVICE_NAME: event-service
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0
      ConnectionStrings__EventsDb: Host=events-db;Port=5432;Database=events;Username=postgres;Password=postgres
      Kafka__BootstrapServers: kafka:29092
      UserJwtToken__Secret: lemon-dipper-kiwi-wish-whisking-squander
      Redis__Endpoints: redis:6379
      Otlp__Endpoint: http://jaeger:4317
    depends_on:
      events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  booking-service:
    build:
      context: .
      args:
        PROJECT: src/EventManager.BookingService/EventManager.BookingService.Presentation/EventManager.BookingService.Presentation.csproj
    command: ["EventManager.BookingService.Presentation.dll"]
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      OTEL_SERVICE_NAME: booking-service
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0
      ConnectionStrings__BookingDb: Host=bookings-db;Port=5432;Database=bookings;Username=postgres;Password=postgres
      Kafka__BootstrapServers: kafka:29092
      UserJwtToken__Secret: lemon-dipper-kiwi-wish-whisking-squander
      Otlp__Endpoint: http://jaeger:4317
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  users-db-data:
  events-db-data:
  bookings-db-data:
  grafana-data:
